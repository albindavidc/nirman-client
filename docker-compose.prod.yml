# Docker Compose for Frontend Production (Standalone)
# Usage: docker-compose -f docker-compose.prod.yml up --build -d
# Run from: front-end/ directory

services:
  # ===========================================
  # Frontend (Angular + Nginx)
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: nirman-frontend-prod
    restart: always
    ports:
      - "80:80"
    networks:
      - nirman-frontend-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

# ===========================================
# Networks
# ===========================================
networks:
  nirman-frontend-network:
    driver: bridge

<div class="container mx-auto p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Phase Approvals</h1>
  </div>

  <mat-card class="overflow-hidden">
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="(approvals$ | async) || []" class="w-full">
        <!-- Project Name Column -->
        <ng-container matColumnDef="projectName">
          <th mat-header-cell *matHeaderCellDef>Project</th>
          <td mat-cell *matCellDef="let approval">
            {{ approval.projectName || "N/A" }}
          </td>
        </ng-container>

        <!-- Phase Name Column -->
        <ng-container matColumnDef="phaseName">
          <th mat-header-cell *matHeaderCellDef>Phase</th>
          <td mat-cell *matCellDef="let approval">
            {{ approval.phaseName || approval.phaseId }}
          </td>
        </ng-container>

        <!-- Requested By Column -->
        <ng-container matColumnDef="requestedBy">
          <th mat-header-cell *matHeaderCellDef>Requested By</th>
          <td mat-cell *matCellDef="let approval">
            {{ approval.requesterName }}
          </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let approval">
            <span
              class="px-2 py-1 rounded-full text-xs font-medium"
              [ngClass]="getStatusClass(approval.approvalStatus)"
            >
              {{ approval.approvalStatus | titlecase }}
            </span>
          </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="requestedAt">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let approval">
            {{ approval.createdAt | date: "mediumDate" }}
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let approval">
            <button
              mat-icon-button
              color="primary"
              (click)="viewDetails(approval)"
              title="View Details"
            >
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <div
        *ngIf="(approvals$ | async)?.length === 0"
        class="p-8 text-center text-gray-500"
      >
        No phase approvals found.
      </div>
    </div>
  </mat-card>
</div>

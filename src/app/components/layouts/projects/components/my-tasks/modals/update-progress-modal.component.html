<app-shared-modal
  title="Update Task Progress"
  subtitle="Update the progress of your assigned task"
  (close)="dialogRef.close()"
>
  <form [formGroup]="form">
    <div class="form-group mb-4">
      <label class="form-label block mb-1 font-medium">Task Name</label>
      <input
        class="form-input readonly w-full p-2 bg-zinc-800 border-zinc-700 rounded text-gray-400"
        [value]="data.task.name"
        readonly
      />
    </div>

    <div class="form-group mb-4">
      <label class="form-label block mb-1 font-medium">Progress (%)</label>
      <input
        type="number"
        class="form-input w-full p-2 bg-transparent border border-gray-600 rounded text-white focus:border-blue-500 outline-none"
        formControlName="progress"
        min="0"
        max="100"
      />
    </div>

    <div class="form-group mb-4">
      <label class="form-label block mb-1 font-medium">Status</label>
      <div class="relative">
        <select
          class="form-select w-full p-2 bg-transparent border border-gray-600 rounded text-white appearance-none focus:border-blue-500 outline-none"
          formControlName="status"
        >
          <option value="In Progress" class="bg-zinc-800">In Progress</option>
          <option value="Completed" class="bg-zinc-800">Completed</option>
          <option value="Delayed" class="bg-zinc-800">Delayed</option>
        </select>
        <mat-icon
          class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400"
          >arrow_drop_down</mat-icon
        >
      </div>
    </div>

    <div class="form-group">
      <label class="form-label block mb-1 font-medium">Notes / Comments</label>
      <textarea
        class="form-textarea w-full p-2 bg-transparent border border-gray-600 rounded text-white min-h-[100px]"
        formControlName="notes"
        placeholder="Add any notes..."
        rows="4"
      ></textarea>
    </div>
  </form>

  <div actions>
    <button mat-button (click)="dialogRef.close()" class="cancel-btn">
      Cancel
    </button>
    <button
      mat-raised-button
      color="primary"
      class="save-btn"
      (click)="onSubmit()"
    >
      <mat-icon>save</mat-icon>
      Save Progress
    </button>
  </div>
</app-shared-modal>

<app-shared-modal title="Approve Phase" (close)="onCancel()">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="phase-info">
      <span class="label">Phase</span>
      <span class="value">{{ data.phaseName }}</span>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Manager Comments</mat-label>
      <textarea
        matInput
        formControlName="comments"
        placeholder="Add any comments or observations (optional)"
        rows="4"
      ></textarea>
      <mat-hint align="end"
        >{{ form.get("comments")?.value?.length || 0 }}/1000</mat-hint
      >
      @if (form.get("comments")?.hasError("maxlength")) {
        <mat-error>Comments cannot exceed 1000 characters</mat-error>
      }
    </mat-form-field>
  </form>

  <div actions>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button
      mat-flat-button
      type="submit"
      class="approve-btn"
      [disabled]="isSubmitting"
      (click)="onSubmit()"
    >
      <mat-icon>check</mat-icon>
      <span>Submit Approval</span>
    </button>
  </div>
</app-shared-modal>

<app-shared-modal title="Reject Phase" (close)="onCancel()">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="phase-info">
      <span class="label">Phase</span>
      <span class="value">{{ data.phaseName }}</span>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Manager Comments *</mat-label>
      <textarea
        matInput
        formControlName="comments"
        placeholder="Explain the reason for rejection..."
        rows="4"
      ></textarea>
      @if (form.get("comments")?.hasError("required")) {
        <mat-error> Comments are required when rejecting a phase </mat-error>
      }
    </mat-form-field>
  </form>

  <div actions>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button
      mat-flat-button
      type="submit"
      class="reject-btn"
      [disabled]="form.invalid || isSubmitting"
      (click)="onSubmit()"
    >
      <mat-icon>close</mat-icon>
      <span>Submit Rejection</span>
    </button>
  </div>
</app-shared-modal>

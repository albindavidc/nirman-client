<app-shared-modal
  [title]="'Edit Phase: ' + data.phase.name"
  (close)="onCancel()"
>
  <form [formGroup]="phaseForm" (ngSubmit)="onSubmit()">
    <div class="modal-content">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Phase Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g. Foundation" />
        <mat-error *ngIf="phaseForm.get('name')?.hasError('required')">
          Name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea
          matInput
          formControlName="description"
          placeholder="Phase details..."
          rows="3"
        ></textarea>
      </mat-form-field>

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Planned Start Date</mat-label>
          <input
            matInput
            [matDatepicker]="startPicker"
            formControlName="plannedStartDate"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="startPicker"
          ></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Planned End Date</mat-label>
          <input
            matInput
            [matDatepicker]="endPicker"
            formControlName="plannedEndDate"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="endPicker"
          ></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Actual Start Date</mat-label>
          <input
            matInput
            [matDatepicker]="actualStartPicker"
            formControlName="actualStartDate"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="actualStartPicker"
          ></mat-datepicker-toggle>
          <mat-datepicker #actualStartPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Actual End Date</mat-label>
          <input
            matInput
            [matDatepicker]="actualEndPicker"
            formControlName="actualEndDate"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="actualEndPicker"
          ></mat-datepicker-toggle>
          <mat-datepicker #actualEndPicker></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status">
            <mat-option value="Not Started">Not Started</mat-option>
            <mat-option value="In Progress">In Progress</mat-option>
            <mat-option value="Completed">Completed</mat-option>
            <mat-option value="On Hold">On Hold</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Sequence</mat-label>
          <input matInput type="number" formControlName="sequence" />
          <mat-error *ngIf="phaseForm.get('sequence')?.hasError('required')">
            Sequence is required
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Progress (%)</mat-label>
          <input
            matInput
            type="number"
            min="0"
            max="100"
            formControlName="progress"
          />
        </mat-form-field>
      </div>
    </div>
  </form>

  <div actions>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="onSubmit()"
      [disabled]="phaseForm.invalid || phaseForm.pristine"
    >
      Update Phase
    </button>
  </div>
</app-shared-modal>

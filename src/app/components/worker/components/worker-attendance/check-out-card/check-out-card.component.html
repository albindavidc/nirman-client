<!-- front-end/src/app/components/worker/components/worker-attendance/check-out-card/check-out-card.component.html -->
<div class="card">
  <p class="card__label">Check Out</p>

  <div class="card__time" [class.card__time--active]="checkOutTime()">
    {{ checkOutTime() || "--:--" }}
  </div>

  <p class="card__hint">
    {{ checkOutTime() ? "Checked out for today" : "Click below to check out" }}
  </p>

  <button
    class="btn-action btn-action--out"
    [class.btn-action--done]="!!checkOutTime()"
    [class.btn-action--disabled]="!canCheckOut()"
    [class.btn-action--busy]="isLoading()"
    [disabled]="!canCheckOut() || isLoading()"
    (click)="checkOut.emit()"
  >
    @if (!isLoading()) {
      <span class="spinner"></span>
    }

    <ng-container>
      <mat-icon>logout</mat-icon>

      {{ checkOutTime() ? "DONE" : "CHECK OUT" }}
    </ng-container>
  </button>

  <p class="card__hours">
    <mat-icon>schedule</mat-icon>
    Hours Today: <strong>{{ hoursToday() }}</strong>
  </p>
</div>

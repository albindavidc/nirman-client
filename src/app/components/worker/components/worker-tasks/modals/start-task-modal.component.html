<app-shared-modal
  title="Start Task"
  subtitle="Begin working on this task"
  (closeModal)="dialogRef.close()"
>
  <form [formGroup]="form">
    <div class="form-group">
      <label for="taskName" class="form-label">Task Name</label>
      <input
        id="taskName"
        class="form-input readonly"
        [value]="data.task.name"
        readonly
      />
    </div>

    <div class="form-group">
      <label for="startTime" class="form-label">Start Time</label>
      <div class="input-wrapper">
        <input
          id="startTime"
          class="form-input readonly"
          [value]="startTime"
          readonly
        />
        <mat-icon class="trailing-icon">schedule</mat-icon>
      </div>
    </div>

    <div class="form-group">
      <label for="initialNotes" class="form-label">Initial Notes</label>
      <textarea
        id="initialNotes"
        class="form-textarea"
        formControlName="notes"
        placeholder="Add any initial observations or notes..."
        rows="4"
      ></textarea>
    </div>
  </form>

  <div actions>
    <button mat-button (click)="dialogRef.close()" class="cancel-btn">
      Cancel
    </button>
    <button
      mat-raised-button
      color="primary"
      class="submit-btn"
      (click)="onSubmit()"
    >
      <mat-icon>play_arrow</mat-icon>
      Start Task
    </button>
  </div>
</app-shared-modal>

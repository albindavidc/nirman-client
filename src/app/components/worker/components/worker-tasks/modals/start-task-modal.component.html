<app-shared-modal
  title="Start Task"
  subtitle="Begin working on this task"
  (close)="dialogRef.close()"
>
  <form [formGroup]="form">
    <div class="form-group">
      <label class="form-label">Task Name</label>
      <input class="form-input readonly" [value]="data.task.name" readonly />
    </div>

    <div class="form-group">
      <label class="form-label">Start Time</label>
      <div class="input-wrapper">
        <input class="form-input readonly" [value]="startTime" readonly />
        <mat-icon class="trailing-icon">schedule</mat-icon>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Initial Notes</label>
      <textarea
        class="form-textarea"
        formControlName="notes"
        placeholder="Add any initial observations or notes..."
        rows="4"
      ></textarea>
    </div>
  </form>

  <div actions>
    <button mat-button (click)="dialogRef.close()" class="cancel-btn">
      Cancel
    </button>
    <button
      mat-raised-button
      color="primary"
      class="submit-btn"
      (click)="onSubmit()"
    >
      <mat-icon>play_arrow</mat-icon>
      Start Task
    </button>
  </div>
</app-shared-modal>

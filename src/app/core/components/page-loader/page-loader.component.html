<div class="loader-container" @fadeIn @fadeOut>
  <!-- Animated Background Gradient Orbs -->
  <div class="orbs-container">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Main Content -->
  <div class="content-wrapper" @slideUp>
    <!-- Logo Container with Glassmorphism -->
    <div class="logo-card">
      <div class="logo-wrapper">
        <img src="assets/logo.svg" alt="Nirman Logo" />
      </div>

      <!-- Particles -->
      <div class="particles">
        @for (i of particles; track i) {
          <div
            class="particle"
            [style.left.%]="20 + i * 5"
            [style.top.%]="30 + (i % 3) * 20"
            [style.background]="
              i % 2 === 0
                ? 'var(--md-sys-color-primary)'
                : 'var(--md-sys-color-secondary)'
            "
            [style.animation-delay.s]="i * 0.3"
          ></div>
        }
      </div>
    </div>
  </div>

  <!-- Bottom Text -->
</div>

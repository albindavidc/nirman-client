@if (showSplash()) {
  <div class="splash-container" [@fadeOut]="isLoading() ? 'visible' : 'hidden'">
    <div class="glow-background"></div>
    <div class="glow-accent"></div>

    <div class="logo-wrapper" [@pulse]="'active'">
      <div class="logo-box">
        <img src="assets/logo.svg" alt="Nirman" class="logo" />
      </div>
    </div>
  </div>
}

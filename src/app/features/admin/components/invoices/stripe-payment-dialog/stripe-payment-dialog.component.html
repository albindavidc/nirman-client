<div class="stripe-dialog">
  <div class="stripe-dialog__inner">
    <!-- SECTION 2 — Dialog header -->
    <div class="stripe-dialog__header">
      <h2 class="stripe-dialog__title">Secure Checkout</h2>
      <button
        mat-icon-button
        class="stripe-dialog__close"
        (click)="close()"
        [disabled]="processing()"
        aria-label="Close payment dialog"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- SECTION 3 — Invoice summary card -->
    <div class="stripe-dialog__summary">
      <div class="stripe-dialog__summary-row">
        <span class="label-caps">Invoice</span>
        <span class="stripe-dialog__invoice-number"
          >#{{ data.invoiceNumber }}</span
        >
      </div>
      <div class="stripe-dialog__summary-row">
        <span class="label-caps">Payable Amount</span>
        <span class="stripe-dialog__amount">{{
          data.amount | currency : data.currency
        }}</span>
      </div>
    </div>

    <form (submit)="handleSubmit($event)" class="payment-form">
      <!-- SECTION 4 — Card input field -->
      <span class="label-caps stripe-dialog__field-label">Card Details</span>
      <div #cardElement class="stripe-dialog__card-input"></div>

      <!-- SECTION 5 — Error state -->
      @if (error()) {
        <div class="stripe-dialog__error" role="alert" aria-live="polite">
          <mat-icon class="icon-sm">error_outline</mat-icon>
          <span>{{ error() }}</span>
        </div>
      }

      <!-- SECTION 6 — Submit button -->
      <button
        type="submit"
        class="stripe-dialog__submit-btn"
        [disabled]="processing() || !stripeLoaded()"
        [class.stripe-dialog__submit-btn--processing]="processing()"
        aria-label="Submit payment"
      >
        @if (processing()) {
          <mat-spinner
            diameter="20"
            class="stripe-dialog__spinner"
          ></mat-spinner>
        } @else {
          <mat-icon class="icon-sm">payments</mat-icon>
        }
        <span>{{ processing() ? "Processing..." : "Pay with Stripe" }}</span>
      </button>
    </form>

    <!-- SECTION 7 — Security footer -->
    <div class="stripe-dialog__footer">
      <mat-icon class="icon-sm stripe-dialog__lock-icon">lock</mat-icon>
      <span>End-to-end encrypted by Stripe</span>
    </div>
  </div>
</div>

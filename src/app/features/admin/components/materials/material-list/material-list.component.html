<div class="materials-container">
  <header class="page-header">
    <div class="title-group">
      <h1>Material Management</h1>
      <p class="subtitle">Manage the global catalog</p>
    </div>
    <button mat-flat-button color="primary" class="add-btn" (click)="openMaterialModal()">
      <mat-icon>add</mat-icon>
      Create New Material
    </button>
  </header>

  <div class="tab-content">
    <div class="filter-bar glass-morphism">
      <div class="search-box">
        <mat-icon>search</mat-icon>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchChange($event)"
          placeholder="Search by name, code, or category..."
        />
      </div>
    </div>

    <div class="table-container glass-morphism">
      <table mat-table [dataSource]="filteredMaterials()" class="material-table">
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef> Code </th>
          <td mat-cell *matCellDef="let element" class="code-cell"> {{element.code}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element" class="name-cell"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef> Category </th>
          <td mat-cell *matCellDef="let element">
            <span class="category-badge">{{element.category}}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="unit">
          <th mat-header-cell *matHeaderCellDef> Unit </th>
          <td mat-cell *matCellDef="let element"> {{element.unit}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let element">
            <div class="action-buttons">
              <button mat-icon-button color="primary" (click)="openMaterialModal(element)" matTooltip="Edit Material">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteMaterial(element)" matTooltip="Delete Material">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell empty-cell" colspan="5">
            <div class="empty-state">
              <mat-icon>inventory_2</mat-icon>
              <p>No materials found matching "{{searchQuery}}"</p>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </div>
</div>

<app-shared-modal title="Edit Member Role" (close)="close()">
  <p class="member-name">
    Member: <strong>{{ data.userName }}</strong>
  </p>

  <mat-form-field appearance="outline" class="role-select">
    <mat-label>Role</mat-label>
    <mat-select [formControl]="roleControl">
      <mat-option value="Supervisor">Supervisor</mat-option>
      <mat-option value="Engineer">Engineer</mat-option>
      <mat-option value="Foreman">Foreman</mat-option>
      <mat-option value="Technician">Technician</mat-option>
      <mat-option value="Worker">Worker</mat-option>
      <mat-option value="Viewer">Viewer</mat-option>
    </mat-select>
  </mat-form-field>

  <div actions>
    <button mat-button (click)="close()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      (click)="save()"
      [disabled]="loading"
    >
      {{ loading ? "Saving..." : "Save Changes" }}
    </button>
  </div>
</app-shared-modal>

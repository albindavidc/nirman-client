<app-shared-modal
  title="Start Task"
  subtitle="Begin working on this task"
  (close)="dialogRef.close()"
>
  <form [formGroup]="form">
    <div class="form-group mb-4">
      <label class="form-label block mb-1 font-medium">Task Name</label>
      <input
        class="form-input readonly w-full p-2 bg-zinc-800 border-zinc-700 rounded text-gray-400"
        [value]="data.task.name"
        readonly
      />
    </div>

    <div class="form-group mb-4">
      <label class="form-label block mb-1 font-medium">Start Time</label>
      <div class="relative">
        <input
          class="form-input readonly w-full p-2 bg-zinc-800 border-zinc-700 rounded text-gray-400"
          [value]="startTime"
          readonly
        />
        <mat-icon
          class="input-icon absolute right-2 top-1/2 -translate-y-1/2 text-gray-500"
          >schedule</mat-icon
        >
      </div>
    </div>

    <div class="form-group">
      <label class="form-label block mb-1 font-medium">Initial Notes</label>
      <textarea
        class="form-textarea w-full p-2 bg-transparent border border-gray-600 rounded text-white min-h-[100px]"
        formControlName="notes"
        placeholder="Add any initial observations or notes..."
        rows="4"
      ></textarea>
    </div>
  </form>

  <div actions>
    <button mat-button (click)="dialogRef.close()" class="cancel-btn">
      Cancel
    </button>
    <button
      mat-raised-button
      color="primary"
      class="start-btn"
      (click)="onSubmit()"
    >
      <mat-icon>play_arrow</mat-icon>
      Start Task
    </button>
  </div>
</app-shared-modal>

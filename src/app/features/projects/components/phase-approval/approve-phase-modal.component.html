<app-shared-modal title="Approve Phase" (close)="onCancel()">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="phase-info mb-4">
      <span
        class="label text-zinc-400 block text-xs uppercase tracking-wider mb-1"
        >Phase</span
      >
      <span class="value text-white text-lg font-medium">{{
        data.phaseName
      }}</span>
    </div>

    <mat-form-field appearance="outline" class="full-width w-full">
      <mat-label>Manager Comments</mat-label>
      <textarea
        matInput
        formControlName="comments"
        placeholder="Add any comments or observations (optional)"
        rows="4"
        class="bg-transparent text-white"
      ></textarea>
    </mat-form-field>
  </form>

  <div actions>
    <button mat-button type="button" (click)="onCancel()" class="text-gray-400">
      Cancel
    </button>
    <button
      mat-flat-button
      type="submit"
      class="approve-btn bg-green-600 text-white hover:bg-green-700"
      [disabled]="isSubmitting"
      (click)="onSubmit()"
    >
      <mat-icon class="mr-2">check</mat-icon>
      <span>Submit Approval</span>
    </button>
  </div>
</app-shared-modal>

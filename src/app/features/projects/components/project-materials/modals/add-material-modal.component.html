<app-shared-modal title="Add New Material" (close)="dialogRef.close()">
  <form [formGroup]="form" class="flex flex-col gap-4">
    <mat-form-field appearance="outline">
      <mat-label>Material Name</mat-label>
      <input
        matInput
        formControlName="name"
        placeholder="Ex: Portland Cement"
      />
    </mat-form-field>

    <div class="flex gap-4">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" placeholder="Ex: MAT-001" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          <mat-option value="Cement">Cement</mat-option>
          <mat-option value="Steel">Steel</mat-option>
          <mat-option value="Sand">Sand</mat-option>
          <mat-option value="Aggregates">Aggregates</mat-option>
          <mat-option value="Bricks">Bricks</mat-option>
          <mat-option value="Wood">Wood</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Unit</mat-label>
      <input matInput formControlName="unit" placeholder="Ex: bags, tonnes" />
    </mat-form-field>

    <div class="flex gap-4">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Reorder Level</mat-label>
        <input matInput type="number" formControlName="reorderLevel" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Unit Price</mat-label>
        <input matInput type="number" formControlName="unitPrice" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Specifications</mat-label>
      <input matInput formControlName="specifications" />
    </mat-form-field>
  </form>

  <div actions>
    <button mat-button (click)="dialogRef.close()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      (click)="onSubmit()"
      [disabled]="form.invalid"
    >
      Add Material
    </button>
  </div>
</app-shared-modal>

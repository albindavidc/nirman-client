<div class="call-overlay">
  <div class="video-container">
    <!-- Waiting / Ringing UI -->
    @if (!isConnected) {
      <div class="waiting-ui">
        <div class="avatar-large">
          <mat-icon>person</mat-icon>
        </div>
        <div class="waiting-text">
          <h2>{{chat?.name}}</h2>
          <div class="status-pill">
            <div class="status-dot pulsing"></div>
            <span>{{ isInitiator ? 'Calling...' : 'Connecting...' }}</span>
          </div>
        </div>
      </div>
    }

    <!-- Remote Video (Large) -->
    <video #remoteVideo class="remote-video" [class.hidden]="!isConnected" autoplay playsinline></video>
    
    <!-- Local Video (Small Overlay) -->
    <div class="local-video-wrapper" [class.video-off]="isVideoOff">
      <video #localVideo class="local-video" autoplay playsinline muted></video>
      @if (isVideoOff) {
        <div class="video-placeholder">
          <mat-icon>videocam_off</mat-icon>
        </div>
      }
    </div>

    <!-- Call Info Overlay (Show after connection) -->
    @if (isConnected) {
      <div class="call-info">
        <h3>{{chat?.name}}</h3>
        <span class="duration">{{callDuration}}</span>
      </div>
    }

    <!-- Call Controls -->
    <div class="call-controls">
      <button class="control-btn" [class.active]="isMuted" (click)="toggleMute()">
        <mat-icon>{{isMuted ? 'mic_off' : 'mic'}}</mat-icon>
      </button>
      
      <button class="control-btn hangup-btn" (click)="endCallSession()">
        <mat-icon>call_end</mat-icon>
      </button>

      <button class="control-btn" [class.active]="isVideoOff" (click)="toggleVideo()">
        <mat-icon>{{isVideoOff ? 'videocam_off' : 'videocam'}}</mat-icon>
      </button>
    </div>
  </div>
</div>

<div class="new-chat-modal">
  <div class="modal-header">
    <h2 mat-dialog-title>New Chat</h2>
    <button mat-icon-button class="close-btn" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search Professionals</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input 
        matInput 
        [(ngModel)]="searchQuery" 
        (ngModelChange)="onSearchChange()" 
        placeholder="Type a name or company..." 
        autocomplete="off"
      >
      @if (isLoading) {
        <mat-spinner matSuffix diameter="20"></mat-spinner>
      }
    </mat-form-field>

    <div class="vendors-list">
      @for (partner of (partners$ | async); track partner.id) {
        <div 
          class="vendor-item" 
          (click)="selectPartner(partner)"
          (keydown.enter)="selectPartner(partner)"
          tabindex="0"
        >
          <div class="vendor-avatar" [ngClass]="partner.type">
            {{ partner.avatar }}
          </div>
          <div class="vendor-info">
            <h4>{{ partner.name }}</h4>
            <span class="vendor-category">
              {{ partner.role }}
            </span>
          </div>
          <mat-icon class="action-icon">chat</mat-icon>
        </div>
      }

      @if ((partners$ | async)?.length === 0 && !isLoading) {
        <div class="empty-state">
          <mat-icon>search_off</mat-icon>
          <p>No professionals found</p>
        </div>
      }
    </div>
  </mat-dialog-content>
</div>

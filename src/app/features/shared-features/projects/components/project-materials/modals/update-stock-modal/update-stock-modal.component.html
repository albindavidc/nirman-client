<app-shared-modal
  title="Update Material Quantity"
  (closeModal)="dialogRef.close()"
>
  <div
    class="material-info mb-6 p-4 bg-zinc-800 rounded-lg border border-zinc-700"
  >
    <h3 class="text-lg font-medium text-white mb-1">
      {{ data.material.name }}
    </h3>
    <p class="text-zinc-400">
      Current Stock:
      <span class="text-white font-medium">{{
        data.material.currentStock
      }}</span>
      {{ data.material.unit }}
    </p>
  </div>

  <form [formGroup]="form" class="form-content flex flex-col gap-4">
    <div class="row flex gap-4">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Transaction Type</mat-label>
        <mat-select formControlName="type">
          <mat-option value="IN">+ Received</mat-option>
          <mat-option value="OUT">- Used</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Quantity ({{ data.material.unit }})</mat-label>
        <input matInput type="number" formControlName="quantity" min="0" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Reference / Invoice No.</mat-label>
      <input matInput formControlName="referenceId" placeholder="Ex: INV-001" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Notes / Used For</mat-label>
      <input
        matInput
        formControlName="notes"
        placeholder="Ex: Foundation work"
      />
    </mat-form-field>

    <div
      class="stock-preview mt-2 p-3 bg-blue-900/20 text-blue-200 rounded text-center border border-blue-800/50"
    >
      New Stock Level:
      <span class="font-bold">{{ calculatedStock }}</span>
      {{ data.material.unit }}
    </div>
  </form>

  <div actions>
    <button mat-button (click)="dialogRef.close()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      (click)="onSubmit()"
      [disabled]="form.invalid"
    >
      Save Update
    </button>
  </div>
</app-shared-modal>

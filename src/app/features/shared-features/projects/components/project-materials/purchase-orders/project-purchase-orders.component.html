<div class="purchase-orders-container">
  <div class="table-section">
    <table mat-table [dataSource]="purchaseOrders" class="po-table">
      <!-- PO Number -->
      <ng-container matColumnDef="poNumber">
        <th mat-header-cell *matHeaderCellDef>PO NUMBER</th>
        <td mat-cell *matCellDef="let po">
          <span class="po-number">{{ po.poNumber }}</span>
        </td>
      </ng-container>

      <!-- Vendor -->
      <ng-container matColumnDef="vendor">
        <th mat-header-cell *matHeaderCellDef>VENDOR</th>
        <td mat-cell *matCellDef="let po">
          <span class="vendor-name">{{ po.vendor_name || 'Vendor' }}</span>
        </td>
      </ng-container>

      <!-- Date -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>ISSUED DATE</th>
        <td mat-cell *matCellDef="let po">
          {{ po.issuedAt | date:'MMM d, yyyy' }}
        </td>
      </ng-container>

      <!-- Amount -->
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>TOTAL AMOUNT</th>
        <td mat-cell *matCellDef="let po">
          <span class="amount">{{ po.totalAmount | currency:'INR' }}</span>
        </td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>STATUS</th>
        <td mat-cell *matCellDef="let po">
          <span class="status-badge" [ngClass]="po.status.toLowerCase()">
            {{ po.status }}
          </span>
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>ACTIONS</th>
        <td mat-cell *matCellDef="let po">
          <div class="action-buttons">
            <button 
              *ngIf="canAddGrn"
              class="action-btn btn-add-grn" 
              (click)="openAddGrnModal(po)"
              matTooltip="Add Goods Receipt Note"
            >
              <mat-icon>add_shopping_cart</mat-icon>
              <span>Add GRN</span>
            </button>
            <button 
              class="action-btn btn-view-history" 
              (click)="openViewGrnsModal(po)"
              matTooltip="View Receipt History"
            >
              <mat-icon>history</mat-icon>
              <span>History</span>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <div *ngIf="purchaseOrders.length === 0" class="empty-state">
      <mat-icon>receipt_long</mat-icon>
      <p>No purchase orders found for this project.</p>
    </div>
  </div>
</div>

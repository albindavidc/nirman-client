<div class="modal-container">
  <div class="modal-header">
    <h2>
      <mat-icon color="primary">fact_check</mat-icon>
      <span>Submit Phase Completion</span>
    </h2>
    <button mat-icon-button [mat-dialog-close]="null" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-body">
    <div class="comment-section">
      <span class="form-field-label">Completion Comments</span>
      <textarea 
        class="comment-area" 
        rows="8" 
        [(ngModel)]="comments" 
        placeholder="Provide details about the work completed in this phase. What tasks were finalized? Are there any minor pending items?">
      </textarea>
    </div>

    <div class="evidence-zone">
      <span class="form-field-label">Media Evidence</span>
      <file-pond class="modal-request-pond" [options]="pondOptions"></file-pond>
    </div>
  </div>

  <div class="modal-actions">
    <button mat-button [mat-dialog-close]="null" color="warn">
      Discard
    </button>
    <button mat-flat-button color="primary" 
            [disabled]="isSubmitting || !comments" 
            (click)="onSubmit()">
      @if (!isSubmitting) {
        <mat-icon>send</mat-icon>
      }
      @if (isSubmitting) {
        <mat-spinner diameter="20"></mat-spinner>
      }
      <span class="ml-2">Submit Request</span>
    </button>
  </div>
</div>

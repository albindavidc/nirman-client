<app-shared-modal title="Upload Profile Photo" (close)="onClose()">
  <div
    class="relative border-2 border-dashed border-zinc-700 rounded-lg p-8 text-center transition-colors hover:border-zinc-500 focus:outline-none focus:border-indigo-500"
    [class.border-indigo-500]="isDragOver"
    [class.bg-zinc-800]="isDragOver"
    [class.border-indigo-500]="selectedFile"
    (click)="fileInput.click()"
    (keyup.enter)="fileInput.click()"
    tabindex="0"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <input
      type="file"
      #fileInput
      (change)="onFileSelected($event)"
      accept="image/*"
      class="hidden"
    />

    @if (isUploading) {
      <div class="flex flex-col items-center justify-center py-4">
        <mat-spinner diameter="48"></mat-spinner>
        <p class="mt-4 text-gray-400">Uploading...</p>
      </div>
    } @else if (previewUrl) {
      <div class="flex flex-col items-center">
        <img
          [src]="previewUrl"
          alt="Preview"
          class="max-h-64 rounded-lg shadow-lg mb-4"
        />
        <p class="text-sm text-indigo-400 font-medium">
          Click or drag to change
        </p>
      </div>
    } @else {
      <div class="flex flex-col items-center py-4">
        <mat-icon
          class="text-5xl text-gray-500 mb-4 h-12 w-12 !text-[48px] !leading-[48px]"
          >cloud_upload</mat-icon
        >
        <h3 class="text-lg font-medium text-white mb-2">
          Drag & Drop your image here
        </h3>
        <p class="text-gray-400 mb-2">or click to browse</p>
        <span class="text-xs text-gray-500"
          >Supports: JPG, PNG, GIF, WEBP (Max 5MB)</span
        >
      </div>
    }
  </div>

  @if (errorMessage) {
    <div
      class="mt-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg flex items-center gap-2 text-red-500"
    >
      <mat-icon class="text-base h-4 w-4">error</mat-icon>
      <span class="text-sm">{{ errorMessage }}</span>
    </div>
  }

  <div actions>
    <button mat-stroked-button (click)="onClose()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      [disabled]="!selectedFile || isUploading"
      (click)="onUpload()"
    >
      @if (isUploading) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        Upload
      }
    </button>
  </div>
</app-shared-modal>

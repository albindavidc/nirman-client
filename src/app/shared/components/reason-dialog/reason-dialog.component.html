<app-shared-modal [title]="data.title" (closeModal)="onCancel()">
  <p class="mb-4 text-gray-300">{{ data.message }}</p>
  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Reason</mat-label>
    <textarea
      matInput
      [formControl]="reasonControl"
      placeholder="Please provide a reason..."
      rows="4"
    ></textarea>
    @if (reasonControl.hasError("required")) {
      <mat-error> Reason is required </mat-error>
    }
    @if (reasonControl.hasError("minlength")) {
      <mat-error> Reason must be at least 10 characters </mat-error>
    }
  </mat-form-field>

  <div actions>
    <button mat-button (click)="onCancel()" class="mr-2">
      {{ data.cancelButtonText || "Cancel" }}
    </button>
    <button
      mat-flat-button
      color="warn"
      [disabled]="reasonControl.invalid"
      (click)="onConfirm()"
    >
      {{ data.confirmButtonText || "Confirm" }}
    </button>
  </div>
</app-shared-modal>

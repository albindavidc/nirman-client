<mat-form-field appearance="outline" class="search-field">
  <mat-icon matPrefix>search</mat-icon>
  <input matInput [formControl]="searchControl" [placeholder]="placeholder" />
  @if (searchControl.value) {
    <button
      matSuffix
      mat-icon-button
      aria-label="Clear"
      (click)="clearSearch()"
      class="clear-btn"
    >
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>
